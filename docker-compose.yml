# Self-contained stack. The only thing it does NOT run is the chat model --
# that is your existing LiteLLM or Ollama somewhere else on the network, named
# once in .env. Everything else (vector store, embedder, classifier API, n8n)
# comes up here on a private bridge network, no external dependency.
#
#   cp .env.example .env      # then set LLM_URL, LLM_KEY, CHAT_MODEL
#   docker compose up -d --build
#   docker compose exec classifier python -m rag ingest --reset
#
# See README.md for the full first-run checklist -- and its "Chat model
# requirements" section before pointing this at an Ollama backend.
#
# Reaching the chat model: EC_BASE_URL / LLM_URL must be an address a container
# can dial. A model server on THIS host bound to 127.0.0.1 only is NOT reachable
# -- bind it to the docker bridge IP (172.17.0.1) and use
# http://host.docker.internal:<port>/v1. See README section 4a.

services:
  # bge-m3 embeddings, CPU-only, OpenAI-compatible at /v1/embeddings. 1024-dim.
  # First boot downloads the model (~2GB) into the embed-cache volume; later
  # boots are instant.
  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: email-classifier-embedder
    command: ["--model-id", "BAAI/bge-m3", "--auto-truncate"]
    volumes:
      - embed-cache:/data
    networks:
      - emailflow
    restart: unless-stopped

  # Vector store. Internal only -- the API talks to it by service name. Pin the
  # tag to the chromadb version in requirements.txt so client and server speak
  # the same wire format.
  # Service key is deliberately NOT "chromadb" -- see the incident below.
  # This is this stack's own private Chroma, container_name
  # email-classifier-chroma, holding the docs collection this stack ingests.
  local_chromadb:
    image: chromadb/chroma:1.5.9
    container_name: email-classifier-chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma-data:/data
    ports:
      # Loopback only, for running `python -m rag` from the host if you want to.
      # Not needed for normal operation -- ingest runs inside the API container.
      # 8011 rather than 8010: another Chroma may already hold 8010 on the dev
      # box. The container port is still 8000.
      - "127.0.0.1:8011:8000"
    networks:
      - emailflow
    restart: unless-stopped
    # ---------------------------------------------------------------------
    # INCIDENT (2026-09-22): this service used to be named `chromadb:`, which
    # is also the container_name of an unrelated, box-wide Chroma from the
    # `ai-server` stack on the dev box.
    # RAG_CHROMA_HOST=chromadb on the classifier service resolves through
    # Docker's embedded DNS across BOTH networks it joins -- and it resolved
    # to that OTHER container, silently, the whole time. n8n's academy_docs
    # tool points at that same shared instance on purpose (its credential is
    # literally named "Chroma (ai-network)"), so retrieval was still
    # internally consistent -- but this stack's own private Chroma above sat
    # completely unused, several ingests out of date, a trap for anyone who
    # inspects it via port 8011 expecting to see what's actually live.
    # Renaming the service key removes the alias collision for good: no
    # future restart-order change can flip which container "chromadb" means.
    # Do NOT rename this back to `chromadb:`.
    #
    # Since 2026-09-24 the classifier points at this service
    # (RAG_CHROMA_HOST=local_chromadb), so every host is self-contained.

  classifier:
    build: .
    container_name: email-classifier-api
    depends_on:
      - embedder
      - local_chromadb
    environment:
      # --- your chat model, from .env ------------------------------------
      - EC_BASE_URL=${LLM_URL:?set LLM_URL in .env}
      - EC_API_KEY=${LLM_KEY:-}
      - EC_SMALL_MODEL=${CHAT_MODEL:?set CHAT_MODEL in .env}
      # No separate large model -- classification and drafting both run on the
      # one chat model. Override EC_LARGE_MODEL in .env only if you have a
      # bigger one worth using for `--large` evals.
      - EC_LARGE_MODEL=${CHAT_MODEL_LARGE:-${CHAT_MODEL}}
      - EC_THRESHOLD=${EC_THRESHOLD:-0.9}
      - EC_NON_ACADEMIC_THRESHOLD=${EC_NON_ACADEMIC_THRESHOLD:-${EC_THRESHOLD:-0.9}}
      # Ollama backends: see README.md "Chat model requirements". No-ops unset.
      - EC_ALLOW_UNCALIBRATED=${EC_ALLOW_UNCALIBRATED:-}
      - EC_NUM_CTX=${EC_NUM_CTX:-}
      # Reply-shell wording. Override in .env; defaults match rag/core.py. A
      # literal \n in the value becomes a line break.
      - RAG_EMAIL_GREETING=${RAG_EMAIL_GREETING:-Hello,}
      - RAG_EMAIL_SIGNOFF=${RAG_EMAIL_SIGNOFF:-Best regards,\nThe Training Team}
      # --- review queue send (Graph, app-only) -- see .env.example ---------
      # Unset by default: the review queue at /review still works without
      # these, Send just returns a clear "not configured" error instead of
      # sending. Fill in .env once the Azure app registration exists.
      - GRAPH_TENANT_ID=${GRAPH_TENANT_ID:-}
      - GRAPH_CLIENT_ID=${GRAPH_CLIENT_ID:-}
      - GRAPH_CLIENT_SECRET=${GRAPH_CLIENT_SECRET:-}
      - GRAPH_MAILBOX=${GRAPH_MAILBOX:-}
      # UI-testing only: set to 1 in .env to make /review/{id}/send skip the
      # real Graph call (still writes the DB row as sent). Unset/0 for real
      # use -- see api.py's REVIEW_DRY_RUN.
      - REVIEW_DRY_RUN=${REVIEW_DRY_RUN:-}
      # --- everything below is in-compose wiring, do not touch ------------
      # This stack's own Chroma (local_chromadb above), which n8n's
      # academy_docs credential also points at (email-classifier-chroma:8000)
      # -- so ingest, /knowledge edits and both reply paths share one store.
      - RAG_CHROMA_HOST=local_chromadb
      - RAG_CHROMA_PORT=8000
      - RAG_COLLECTION=docs
      - RAG_MAX_DISTANCE=1.0
      - RAG_TOP_K=4
      - RAG_EMBED_MODEL=bge-m3
      - RAG_EMBED_BASE_URL=http://embedder:80/v1
      - THREADS_DB=/app/data/threads.db
      - THREAD_MAX_HISTORY_CHARS=6000
      - THREAD_KEEP_RECENT=4
      - THREAD_REWRITE_QUERY=1
    volumes:
      # threads.db and its -wal/-shm siblings live here so conversation history
      # survives a rebuild. Source documents in data/docs are read from here too.
      - ./data:/app/data
    ports:
      - "127.0.0.1:8100:8100"
    # Lets EC_BASE_URL use http://host.docker.internal:<port>/v1 to reach a
    # model server on the docker host itself -- provided that server is bound to
    # 0.0.0.0 / the bridge IP, not 127.0.0.1 only. Harmless if you point
    # EC_BASE_URL at a LAN/tailnet address or a shared docker network instead.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8100/health').status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - emailflow
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    environment:
      - N8N_SECURE_COOKIE=false
      - N8N_RUNNERS_ENABLED=true
      # Editor/OAuth stays on localhost. n8n is loopback-only (see ports
      # below), and Microsoft Entra only accepts an https:// or
      # http://localhost OAuth redirect -- so localhost is what makes the
      # Outlook sign-in work (and is what the UI itself is reached at, over
      # an SSH tunnel). N8N_HOST/N8N_PROTOCOL/N8N_EDITOR_BASE_URL drive that
      # and stay as localhost.
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_EDITOR_BASE_URL=http://localhost:5678/
      # WEBHOOK_URL is different: it's what n8n bakes into generated webhook
      # URLs, e.g. $execution.resumeUrl for the Academy Agent workflow's
      # "Wait for review" node -- and that one gets POSTed to by the
      # classifier container (mail/graph.py's review_send()), not by a
      # browser. "localhost" there resolves to the classifier container
      # itself, not n8n, so it must be the docker-network service name.
      - WEBHOOK_URL=http://n8n:5678/
    ports:
      # Loopback only: n8n executes arbitrary code, so never expose it on a
      # shared network. Reach it with an SSH tunnel from your workstation:
      #   ssh -L 5678:127.0.0.1:5678 <this-host>
      # then open http://localhost:5678
      - "127.0.0.1:5678:5678"
    # Same as the classifier: the AI Agent's chat-model credential reaches a
    # model server on this host at http://host.docker.internal:<port>/v1.
    # Linux Docker does not define that name unless it is mapped here.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - emailflow
    restart: unless-stopped

volumes:
  embed-cache:
  chroma-data:
  n8n_data:

networks:
  emailflow:
    driver: bridge
