# Self-contained stack. The only thing it does NOT run is the chat model --
# that is your existing LiteLLM or Ollama somewhere else on the network, named
# once in .env. Everything else (vector store, embedder, classifier API, n8n)
# comes up here on a private bridge network, no external dependency.
#
#   cp .env.example .env      # then set LLM_URL, LLM_KEY, CHAT_MODEL
#   docker compose up -d --build
#   docker compose exec classifier python -m rag ingest --reset
#
# See HANDOFF.md for the full first-run checklist -- and its section 6 before
# pointing this at an Ollama backend.

services:
  # bge-m3 embeddings, CPU-only, OpenAI-compatible at /v1/embeddings. Replaces
  # the llama-bge-m3 server that used to live in the ai-server stack. 1024-dim,
  # same as before, so retrieval behaviour is unchanged. First boot downloads
  # the model (~2GB) into the embed-cache volume; subsequent boots are instant.
  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    container_name: email-classifier-embedder
    command: ["--model-id", "BAAI/bge-m3", "--auto-truncate"]
    volumes:
      - embed-cache:/data
    networks:
      - emailflow
    restart: unless-stopped

  # Vector store. Internal only -- the API talks to it by service name. Pin the
  # tag to the chromadb version in requirements-rag.txt so client and server
  # speak the same wire format.
  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: email-classifier-chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma-data:/data
    ports:
      # Loopback only, for running `python -m rag` from the host if you want to.
      # Not needed for normal operation -- ingest runs inside the API container.
      # 8011 rather than 8010: another Chroma (the old ai-server stack) may
      # already hold 8010 on the dev box. The container port is still 8000.
      - "127.0.0.1:8011:8000"
    networks:
      - emailflow
    restart: unless-stopped

  classifier:
    build: .
    container_name: email-classifier-api
    depends_on:
      - embedder
      - chromadb
    environment:
      # --- your chat model, from .env ------------------------------------
      - EC_BASE_URL=${LLM_URL:?set LLM_URL in .env}
      - EC_API_KEY=${LLM_KEY:-}
      - EC_SMALL_MODEL=${CHAT_MODEL:?set CHAT_MODEL in .env}
      # No separate large model -- classification and drafting both run on the
      # one chat model. Override EC_LARGE_MODEL in .env only if you have a
      # bigger one worth using for `--large` evals.
      - EC_LARGE_MODEL=${CHAT_MODEL_LARGE:-${CHAT_MODEL}}
      - EC_THRESHOLD=${EC_THRESHOLD:-0.9}
      # Ollama backends: see HANDOFF.md section 6. Both are no-ops when unset.
      - EC_ALLOW_UNCALIBRATED=${EC_ALLOW_UNCALIBRATED:-}
      - EC_NUM_CTX=${EC_NUM_CTX:-}
      # --- everything below is in-compose wiring, do not touch ------------
      # The container name, not the service alias "chromadb": this service is
      # also attached to the external chatmodel network (for LiteLLM), and that
      # network has its own container aliased "chromadb" -- the bare name
      # resolves to the wrong one. The container_name is unambiguous.
      - RAG_CHROMA_HOST=email-classifier-chroma
      - RAG_CHROMA_PORT=8000
      - RAG_COLLECTION=docs
      - RAG_MAX_DISTANCE=1.0
      - RAG_TOP_K=4
      - RAG_EMBED_MODEL=bge-m3
      - RAG_EMBED_BASE_URL=http://embedder:80/v1
      - THREADS_DB=/app/data/threads.db
      - THREAD_MAX_HISTORY_CHARS=6000
      - THREAD_KEEP_RECENT=4
      - THREAD_REWRITE_QUERY=1
    volumes:
      # threads.db and its -wal/-shm siblings live here so conversation history
      # survives a rebuild. Source documents in data/docs are read from here too.
      - ./data:/app/data
    ports:
      - "127.0.0.1:8100:8100"
    # Kept for the documented "LiteLLM on the docker host itself" setup, but the
    # local stack reaches LiteLLM by service name over the chatmodel network
    # instead (see below) -- a host-published 127.0.0.1:PORT mapping is not
    # reachable through host-gateway, only a 0.0.0.0 / bridge-IP one is.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8100/health').status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - emailflow
      # LiteLLM (the chat model) lives in the ai-server compose and publishes
      # only 127.0.0.1:4001, so it is not reachable via host-gateway. Join its
      # network and address it as http://litellm:4000/v1 (set in .env).
      - chatmodel
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    environment:
      - N8N_SECURE_COOKIE=false
      - N8N_RUNNERS_ENABLED=true
      # Everything stays on localhost. n8n is loopback-only (see ports below),
      # the Outlook workflow is a polling trigger with no inbound webhook or
      # form, and Microsoft Entra only accepts an https:// or http://localhost
      # OAuth redirect -- so localhost is also what makes the Outlook sign-in
      # work. Reach the UI through an SSH tunnel.
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_EDITOR_BASE_URL=http://localhost:5678/
    ports:
      # Loopback only: n8n executes arbitrary code, so never expose it on a
      # shared network. Reach it with an SSH tunnel from your workstation:
      #   ssh -L 5678:127.0.0.1:5678 <this-host>
      # then open http://localhost:5678
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - emailflow
      # The AI Agent node's chat model and vector store (LiteLLM, and the
      # llama-bge-m3 / shared services) live on the ai-server network. n8n makes
      # only outbound calls to them; its own 5678 stays loopback-published.
      - chatmodel
    restart: unless-stopped

volumes:
  embed-cache:
  chroma-data:
  n8n_data:

networks:
  emailflow:
    driver: bridge
  # The ai-server stack's network, where LiteLLM (and the shared Chroma, and the
  # llama.cpp runners) live. External: this compose does not create or own it.
  # `docker network ls | grep ai-network` if the name has drifted.
  chatmodel:
    external: true
    name: ai-server_ai-network
